<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeLock — Dashboard</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="brand">
      <img src="../assets/icon32.png" alt="ChromeLock" class="brand-icon" />
      <span class="brand-name">ChromeLock</span>
      <span class="status-pill">🔓 Unlocked</span>
    </div>

    <div class="top-actions">
      <button id="quick-lock-btn" class="action-btn lock-action-btn" title="Lock Chrome Now (Ctrl+Shift+L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Lock Now</span>
      </button>
      <a href="../settings/settings.html" class="action-btn settings-action-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </div>
  </header>

  <!-- Main Dashboard -->
  <main class="dashboard-content">
    <!-- Clock & Date Widget (includes seconds) -->
    <div class="clock-widget">
      <div id="clock-time" class="clock-time">12:00:00</div>
      <div id="clock-date" class="clock-date">Saturday, September 12</div>
    </div>

    <!-- Search Box -->
    <form id="search-form" class="search-form" action="https://www.google.com/search" method="GET">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          name="q"
          id="search-input"
          class="search-input"
          placeholder="Search Google or type a URL"
          autocomplete="off"
          autofocus
        />
      </div>
    </form>

    <!-- Customizable Shortcuts Grid with Real Site Thumbnails -->
    <div id="shortcuts-grid" class="shortcuts-grid">
      <!-- Injected dynamically via newtab.js -->
    </div>
  </main>

  <!-- Add / Edit Shortcut Modal -->
  <div id="shortcut-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="shortcut-modal-title">
    <div class="modal-card shortcut-modal-card">
      <div class="modal-header">
        <h2 id="shortcut-modal-title" class="modal-title">Add Shortcut</h2>
        <button type="button" id="close-shortcut-modal-btn" class="modal-close-btn" aria-label="Close modal">&times;</button>
      </div>
      <form id="shortcut-form" class="shortcut-form" novalidate autocomplete="off">
        <div class="input-group">
          <label for="shortcut-name-input" class="input-label">Name</label>
          <input
            type="text"
            id="shortcut-name-input"
            class="password-input"
            placeholder="e.g. YouTube, ChatGPT, GitHub"
            required
          />
        </div>
        <div class="input-group">
          <label for="shortcut-url-input" class="input-label">Web Address (URL)</label>
          <input
            type="text"
            id="shortcut-url-input"
            class="password-input"
            placeholder="e.g. https://youtube.com"
            required
          />
        </div>

        <div class="favicon-preview-wrap">
          <span class="preview-label">Live Icon Preview:</span>
          <div class="shortcut-icon-circle preview-circle">
            <img id="shortcut-favicon-preview" src="../assets/icon32.png" alt="icon preview" class="real-favicon" />
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="delete-shortcut-btn" class="btn-danger-outline hidden">Delete</button>
          <button type="submit" id="save-shortcut-btn" class="unlock-btn">Save Shortcut</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
