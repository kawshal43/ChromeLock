<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeLock — Initial Setup</title>
  <link rel="stylesheet" href="../lock/lock.css">
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <div class="lock-wrapper">
    <main class="lock-card" role="region" aria-labelledby="setup-title">
      <!-- Header -->
      <div class="lock-header">
        <div class="lock-icon-container" aria-hidden="true">
          <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            <circle cx="12" cy="16" r="1.5"></circle>
            <path d="M12 17.5v2"></path>
          </svg>
        </div>
        <h1 id="setup-title" class="lock-title">CHROMELOCK</h1>
        <p class="lock-subtitle">Create a master password to protect your browsing</p>
      </div>

      <!-- Setup Form -->
      <form id="setup-form" class="lock-form" novalidate autocomplete="off">
        <!-- New Password Input -->
        <div class="input-group">
          <label for="password-input" class="input-label">Create Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password-input"
              class="password-input"
              placeholder="Enter master password (min. 6 characters)"
              autocomplete="new-password"
              autofocus
              required
            />
            <button
              type="button"
              id="toggle-pwd-btn"
              class="toggle-eye-btn"
              aria-label="Toggle password visibility"
            >
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password Input -->
        <div class="input-group">
          <label for="confirm-password-input" class="input-label">Confirm Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm-password-input"
              class="password-input"
              placeholder="Re-enter master password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              id="toggle-confirm-pwd-btn"
              class="toggle-eye-btn"
              aria-label="Toggle confirm password visibility"
            >
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Status Message -->
        <div id="status-container" class="status-container" aria-live="polite">
          <div id="status-message" class="status-message hidden"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="create-lock-btn" class="unlock-btn">
          <span class="btn-text">CREATE LOCK</span>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="lock-footer">
        <span class="security-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Master passwords are never stored in plaintext
        </span>
      </div>
    </main>
  </div>

  <script type="module" src="setup.js"></script>
</body>
</html>
