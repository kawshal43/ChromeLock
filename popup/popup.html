<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeLock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <!-- Header -->
    <div class="popup-header">
      <div class="brand">
        <img src="../assets/icon32.png" alt="ChromeLock" class="popup-logo" />
        <span class="popup-title">ChromeLock</span>
      </div>
      <div id="status-badge" class="badge locked">
        <span class="badge-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </div>

    <!-- Dynamic Content -->
    <div class="popup-body">
      <!-- Unlocked View -->
      <div id="unlocked-view" class="view hidden">
        <p class="view-description">Your Chrome session is currently protected and unlocked.</p>
        <button id="lock-now-btn" class="btn btn-danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          LOCK NOW
        </button>
        <span class="shortcut-tip">Shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>L</kbd></span>
      </div>

      <!-- Locked View -->
      <div id="locked-view" class="view hidden">
        <div class="locked-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            <circle cx="12" cy="16" r="1.5"></circle>
            <path d="M12 17.5v2"></path>
          </svg>
        </div>
        <p class="view-description">Browsing is locked. Authenticate on the lock screen to proceed.</p>
        <button id="open-lock-btn" class="btn btn-primary">Go to Lock Screen</button>
      </div>

      <!-- Not Configured View -->
      <div id="setup-view" class="view hidden">
        <p class="view-description">Initial setup required. Create your master password to start.</p>
        <button id="open-setup-btn" class="btn btn-primary">Complete Setup</button>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="popup-footer">
      <a href="../settings/settings.html" target="_blank" id="open-settings-link" class="footer-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Settings
      </a>
      <span class="version-label" title="Developed by RMA KAWSHAL - 074 0532 502">v1.0.0</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
